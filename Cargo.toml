[package]
name = "minisync"
version = "0.2.0"
edition = "2021"
description = "Minimal personal file sync between your own devices on the same network"
repository = "https://github.com/mk-manishkandel/MiniSync"

[dependencies]
anyhow = "1"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
dirs = "5"
ed25519-dalek = "2"
env_logger = "0.11"
filetime = "0.2"
if-addrs = "0.13"
log = "0.4"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
toml = "0.8"
walkdir = "2"

# Tray / menu-bar icon (Windows and macOS only)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.37"
tray-icon = "0.26"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
